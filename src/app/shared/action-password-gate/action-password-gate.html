<form class="gate" (ngSubmit)="submit()">
  <div class="gate-icon">
    <svg viewBox="0 0 24 24" fill="none">
      <rect x="5" y="10.5" width="14" height="9.5" rx="2" stroke="currentColor" stroke-width="1.7" />
      <path d="M8 10.5V7.5a4 4 0 018 0v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
    </svg>
  </div>
  <h3>{{ title }}</h3>
  <p class="gate-description">{{ description }}</p>

  <input
    class="input gate-input"
    type="password"
    autocomplete="current-password"
    [ngModel]="password()"
    (ngModelChange)="password.set($event)"
    name="gatePassword"
    placeholder="Password"
    autofocus
  />

  @if (error()) {
    <p class="error-text">{{ error() }}</p>
  }

  <button type="submit" class="btn btn-primary gate-submit">Unlock</button>
</form>
